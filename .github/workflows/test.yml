name: Python CI - Pytest

# Condición de activación: Se ejecuta automáticamente ante cada *push* a la rama `main` o cuando se abre una *pull request* dirigida a la rama `main`.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura el entorno de ejecución de Python (con almacenamiento en caché de dependencias de pip para acelerar las compilaciones)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Instalar las dependencias del proyecto
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Ejecutar pruebas automatizadas con pytest (utilizando una base de datos en memoria; no se requiere configuración adicional del servicio MySQL)
      - name: Run pytest suite
        env:
          SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
          SECRET_KEY: "ci_test_secret_key"
        run: |
          python -m pytest -v
